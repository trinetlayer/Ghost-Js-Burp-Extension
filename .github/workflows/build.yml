name: Build GhostJS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the jar to a Release on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build extension jar
        run: ./build.sh

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostjs
          path: dist/ghostjs.jar

      # On a version tag (e.g. v1.0.0), publish the jar to a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ghostjs.jar

// Standard Gradle build (optional — build.sh needs no Gradle at all).
//   gradle jar   ->   build/libs/ghostjs-burp.jar
plugins {
    id 'java'
}

group = 'ghostjs'
version = '1.1.0'

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp at runtime — compile against it, never bundle it.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    // Burp does NOT provide this — must be bundled into the extension jar.
    implementation 'com.formdev:flatlaf:3.7.1'

    // Test-only. Same version is used by test.sh so both paths stay aligned.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'ghostjs-burp'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
